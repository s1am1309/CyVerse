<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mood Detector – Camera</title>
    <!-- Fonts & Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz@14..32&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(145deg, #0b0e1a, #141b2d);
            padding: 1.5rem;
        }
        .card {
            max-width: 1000px;
            width: 100%;
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(20px);
            border-radius: 2.5rem;
            padding: 2rem 2rem 2.5rem;
            border: 1px solid rgba(255,255,255,0.04);
            box-shadow: 0 30px 80px rgba(0,0,0,0.6);
        }
        .header { display: flex; align-items: center; gap: 0.75rem; margin-bottom: 1.5rem; }
        .header .icon { font-size: 2.2rem; }
        .header h1 {
            font-size: 1.7rem;
            font-weight: 700;
            background: linear-gradient(135deg, #f0f3ff, #a8b5ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .header .badge {
            margin-left: auto;
            font-size: 0.7rem;
            font-weight: 600;
            padding: 0.3rem 0.9rem;
            border-radius: 100px;
            background: rgba(120,100,255,0.15);
            color: #b0bfff;
            border: 1px solid rgba(120,100,255,0.15);
        }
        .subtitle { color: rgba(255,255,255,0.4); font-size: 0.95rem; margin-bottom: 1.5rem; }
        .subtitle span { color: rgba(255,255,255,0.6); font-weight: 500; }

        /* Camera + results layout */
        .camera-area {
            display: flex;
            flex-wrap: wrap;
            gap: 1.5rem;
            margin-bottom: 1.5rem;
        }
        .video-wrapper {
            position: relative;
            flex: 2;
            min-width: 280px;
            background: rgba(0,0,0,0.3);
            border-radius: 1.4rem;
            overflow: hidden;
            aspect-ratio: 4/3;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        #overlayCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }
        .video-placeholder {
            color: rgba(255,255,255,0.15);
            text-align: center;
            font-size: 0.9rem;
        }
        .video-placeholder i {
            display: block;
            font-size: 3rem;
            margin-bottom: 0.5rem;
            opacity: 0.4;
        }

        /* Right side results */
        .results-panel {
            flex: 1;
            min-width: 220px;
            background: rgba(255,255,255,0.02);
            border-radius: 1.4rem;
            padding: 1.2rem 1.2rem 1.5rem;
            border: 1px solid rgba(255,255,255,0.04);
        }
        .results-panel .emotion-label {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            padding: 0.4rem 1rem 0.4rem 1.2rem;
            background: rgba(255,255,255,0.03);
            border-radius: 100px;
            border: 1px solid rgba(255,255,255,0.04);
            width: fit-content;
            margin-bottom: 1.2rem;
        }
        .results-panel .emotion-label .emoji { font-size: 2rem; }
        .results-panel .emotion-label .name { font-size: 1.3rem; font-weight: 700; color: #f0f3ff; }
        .results-panel .emotion-label .confidence {
            font-size: 0.8rem;
            font-weight: 500;
            color: rgba(255,255,255,0.35);
            background: rgba(255,255,255,0.04);
            padding: 0.2rem 0.9rem;
            border-radius: 100px;
        }
        .chart { display: flex; flex-direction: column; gap: 0.4rem; margin-top: 0.5rem; }
        .bar-row { display: flex; align-items: center; gap: 0.6rem; }
        .bar-row .label {
            width: 70px;
            flex-shrink: 0;
            font-size: 0.75rem;
            font-weight: 500;
            color: rgba(255,255,255,0.5);
            text-align: right;
        }
        .bar-track { flex: 1; height: 7px; background: rgba(255,255,255,0.04); border-radius: 100px; overflow: hidden; }
        .bar-fill {
            height: 100%;
            border-radius: 100px;
            width: 0%;
            transition: width 0.5s ease;
            background: linear-gradient(90deg, #6c5ce7, #a29bfe);
        }
        .bar-fill.happy { background: linear-gradient(90deg, #fbbf24, #f59e0b); }
        .bar-fill.sad { background: linear-gradient(90deg, #60a5fa, #3b82f6); }
        .bar-fill.angry { background: linear-gradient(90deg, #f87171, #ef4444); }
        .bar-fill.fearful { background: linear-gradient(90deg, #a78bfa, #7c3aed); }
        .bar-fill.surprised { background: linear-gradient(90deg, #34d399, #10b981); }
        .bar-fill.disgusted { background: linear-gradient(90deg, #6ee7b7, #34d399); }
        .bar-fill.neutral { background: linear-gradient(90deg, #9ca3af, #6b7280); }
        .bar-row .pct {
            width: 40px;
            flex-shrink: 0;
            font-size: 0.7rem;
            font-weight: 600;
            color: rgba(255,255,255,0.3);
            text-align: right;
        }
        .no-result {
            color: rgba(255,255,255,0.15);
            text-align: center;
            padding: 1rem 0;
            font-size: 0.85rem;
        }
        .no-result i { display: block; font-size: 2rem; margin-bottom: 0.5rem; opacity: 0.3; }

        /* Controls */
        .controls {
            display: flex;
            gap: 0.8rem;
            flex-wrap: wrap;
            margin-top: 0.5rem;
        }
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.6rem;
            padding: 0.7rem 1.8rem;
            font-family: 'Inter', sans-serif;
            font-size: 0.95rem;
            font-weight: 600;
            border: none;
            border-radius: 100px;
            cursor: pointer;
            transition: 0.25s ease;
            flex: 1 1 auto;
            min-width: 120px;
        }
        .btn-primary {
            background: linear-gradient(135deg, #7c6aff, #5b4ad0);
            color: #fff;
            box-shadow: 0 4px 20px rgba(100,80,255,0.25);
        }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 32px rgba(100,80,255,0.35); }
        .btn-primary:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }
        .btn-danger {
            background: linear-gradient(135deg, #ef4444, #b91c1c);
            color: #fff;
        }
        .btn-danger:hover { transform: translateY(-2px); box-shadow: 0 8px 32px rgba(239,68,68,0.35); }
        .btn-secondary {
            background: rgba(255,255,255,0.05);
            color: rgba(255,255,255,0.5);
            border: 1px solid rgba(255,255,255,0.06);
        }
        .btn-secondary:hover { background: rgba(255,255,255,0.08); color: rgba(255,255,255,0.7); }

        .footer {
            margin-top: 1.8rem;
            padding-top: 1rem;
            border-top: 1px solid rgba(255,255,255,0.03);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 0.5rem;
        }
        .footer .note { font-size: 0.7rem; color: rgba(255,255,255,0.15); }
        .footer .status {
            font-size: 0.7rem;
            font-weight: 500;
            color: rgba(255,255,255,0.15);
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .footer .status .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: rgba(255,255,255,0.08);
            display: inline-block;
        }
        .footer .status .dot.online { background: #34d399; box-shadow: 0 0 12px rgba(52,211,153,0.3); }
        .footer .status .dot.loading { background: #fbbf24; box-shadow: 0 0 12px rgba(251,191,36,0.3); }
        .footer .status .dot.offline { background: #ef4444; box-shadow: 0 0 12px rgba(239,68,68,0.3); }

        @media (max-width: 700px) {
            .camera-area { flex-direction: column; }
            .video-wrapper { aspect-ratio: 4/3; }
            .results-panel { min-width: unset; }
            .card { padding: 1.2rem; }
            .header h1 { font-size: 1.3rem; }
            .btn { flex: 1 1 100%; }
        }
    </style>
</head>
<body>
<div class="card">
    <div class="header">
        <span class="icon">📸</span>
        <h1>Mood Detector</h1>
        <span class="badge">camera · live</span>
    </div>
    <p class="subtitle">Let your face speak – <span>real‑time expression analysis</span> in your browser.</p>

    <!-- Camera + Results -->
    <div class="camera-area">
        <div class="video-wrapper">
            <video id="video" autoplay muted playsinline></video>
            <canvas id="overlayCanvas"></canvas>
            <div class="video-placeholder" id="videoPlaceholder">
                <i class="fa-regular fa-video"></i>
                Camera off
            </div>
        </div>

        <div class="results-panel" id="resultsPanel">
            <div class="emotion-label">
                <span class="emoji" id="topEmoji">😊</span>
                <span class="name" id="topName">—</span>
                <span class="confidence" id="topConfidence">—</span>
            </div>
            <div class="chart" id="chartContainer">
                <!-- bars inserted here -->
                <div class="no-result" id="noResult">
                    <i class="fa-regular fa-face-smile"></i>
                    No face detected yet
                </div>
            </div>
        </div>
    </div>

    <!-- Controls -->
    <div class="controls">
        <button class="btn btn-primary" id="startBtn"><i class="fa-solid fa-play"></i> Start Camera</button>
        <button class="btn btn-danger" id="stopBtn" disabled><i class="fa-solid fa-stop"></i> Stop</button>
    </div>

    <div class="footer">
        <span class="note"><i class="fa-regular fa-circle-check"></i> Powered by face‑api.js</span>
        <span class="status">
            <span class="dot" id="statusDot"></span>
            <span id="statusText">Ready</span>
        </span>
    </div>
</div>

<!-- Dependencies -->
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.15.0/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.13/dist/face-api.js"></script>

<script>
    // ─────────────────────────────────────────────
    //  Camera-based Mood Detector
    //  Uses face-api.js (Vladmandic fork) with SSD Mobilenet V1
    //  and FaceExpressionNet for expression recognition.
    // ─────────────────────────────────────────────

    // DOM refs
    const video = document.getElementById('video');
    const overlayCanvas = document.getElementById('overlayCanvas');
    const ctx = overlayCanvas.getContext('2d');
    const videoPlaceholder = document.getElementById('videoPlaceholder');
    const startBtn = document.getElementById('startBtn');
    const stopBtn = document.getElementById('stopBtn');
    const topEmoji = document.getElementById('topEmoji');
    const topName = document.getElementById('topName');
    const topConfidence = document.getElementById('topConfidence');
    const chartContainer = document.getElementById('chartContainer');
    const noResult = document.getElementById('noResult');
    const statusText = document.getElementById('statusText');
    const statusDot = document.getElementById('statusDot');

    // Emotion mapping
    const EMOTION_MAP = {
        happy: { emoji: '😊', label: 'Happy' },
        sad: { emoji: '😢', label: 'Sad' },
        angry: { emoji: '😠', label: 'Angry' },
        fearful: { emoji: '😨', label: 'Fearful' },
        surprised: { emoji: '😲', label: 'Surprised' },
        disgusted: { emoji: '🤢', label: 'Disgusted' },
        neutral: { emoji: '😐', label: 'Neutral' },
    };

    function getEmotionInfo(expr) {
        const key = expr.toLowerCase();
        return EMOTION_MAP[key] || { emoji: '❓', label: expr };
    }

    let cameraStream = null;
    let detectionInterval = null;
    let isDetecting = false;

    // --- Status helpers ---
    function setStatus(text, state = 'online') {
        statusText.textContent = text;
        statusDot.className = `dot ${state}`;
    }

    function updateResults(expressions) {
        // expressions: { happy, sad, angry, fearful, surprised, disgusted, neutral }
        if (!expressions) {
            noResult.style.display = 'block';
            chartContainer.innerHTML = `
                <div class="no-result" id="noResult">
                    <i class="fa-regular fa-face-smile"></i>
                    No face detected yet
                </div>
            `;
            topEmoji.textContent = '😊';
            topName.textContent = '—';
            topConfidence.textContent = '—';
            return;
        }

        // Sort by probability descending
        const sorted = Object.entries(expressions)
            .map(([label, score]) => ({ label, score }))
            .sort((a, b) => b.score - a.score);

        // Build chart
        let html = '';
        for (const item of sorted) {
            const info = getEmotionInfo(item.label);
            const pct = (item.score * 100).toFixed(1);
            const cls = item.label.toLowerCase();
            html += `
                <div class="bar-row">
                    <span class="label"><span class="emoji-small">${info.emoji}</span>${info.label}</span>
                    <div class="bar-track">
                        <div class="bar-fill ${cls}" style="width: ${pct}%;"></div>
                    </div>
                    <span class="pct">${pct}%</span>
                </div>
            `;
        }
        chartContainer.innerHTML = html;
        noResult.style.display = 'none';

        // Top emotion
        const top = sorted[0];
        if (top) {
            const info = getEmotionInfo(top.label);
            topEmoji.textContent = info.emoji;
            topName.textContent = info.label;
            topConfidence.textContent = `${(top.score * 100).toFixed(1)}%`;
        }
    }

    // --- Draw bounding box and label on canvas ---
    function drawDetection(detection) {
        const videoWidth = video.videoWidth;
        const videoHeight = video.videoHeight;
        overlayCanvas.width = videoWidth;
        overlayCanvas.height = videoHeight;
        ctx.clearRect(0, 0, overlayCanvas.width, overlayCanvas.height);

        if (!detection) return;

        const box = detection.detection.box;
        const x = box.x;
        const y = box.y;
        const w = box.width;
        const h = box.height;

        // Draw rectangle
        ctx.strokeStyle = '#7c6aff';
        ctx.lineWidth = 3;
        ctx.shadowColor = 'rgba(124, 106, 255, 0.5)';
        ctx.shadowBlur = 12;
        ctx.strokeRect(x, y, w, h);
        ctx.shadowBlur = 0;

        // Get top expression
        const expressions = detection.expressions;
        if (expressions) {
            const sorted = Object.entries(expressions).sort((a, b) => b[1] - a[1]);
            const top = sorted[0];
            if (top) {
                const label = top[0];
                const score = top[1];
                const info = getEmotionInfo(label);
                const text = `${info.emoji} ${info.label} ${(score * 100).toFixed(1)}%`;
                ctx.font = 'bold 18px Inter, sans-serif';
                ctx.fillStyle = '#ffffff';
                ctx.shadowColor = 'rgba(0,0,0,0.8)';
                ctx.shadowBlur = 8;
                ctx.fillText(text, x, y - 10);
                ctx.shadowBlur = 0;
            }
        }
    }

    // --- Face detection loop ---
    async function detectFace() {
        if (!video || video.paused || video.ended) return;

        try {
            const detection = await faceapi.detectSingleFace(video, new faceapi.SsdMobilenetv1Options())
                .withFaceExpressions();

            if (detection) {
                drawDetection(detection);
                updateResults(detection.expressions);
            } else {
                // No face
                drawDetection(null);
                updateResults(null);
            }
        } catch (err) {
            console.error('Detection error:', err);
        }
    }

    // --- Start camera and detection ---
    async function startCamera() {
        try {
            setStatus('Requesting camera…', 'loading');
            cameraStream = await navigator.mediaDevices.getUserMedia({
                video: { facingMode: 'user', width: 640, height: 480 },
                audio: false,
            });
            video.srcObject = cameraStream;
            await video.play();
            videoPlaceholder.style.display = 'none';

            // Set canvas size
            overlayCanvas.width = video.videoWidth || 640;
            overlayCanvas.height = video.videoHeight || 480;

            // Start detection loop (every 150ms)
            if (detectionInterval) clearInterval(detectionInterval);
            detectionInterval = setInterval(detectFace, 150);

            startBtn.disabled = true;
            stopBtn.disabled = false;
            setStatus('Running', 'online');
        } catch (err) {
            console.error('Camera error:', err);
            setStatus('Camera access denied', 'offline');
            alert('Could not access camera. Please allow camera permissions and try again.');
        }
    }

    function stopCamera() {
        if (cameraStream) {
            cameraStream.getTracks().forEach(track => track.stop());
            cameraStream = null;
        }
        video.srcObject = null;
        video.pause();
        videoPlaceholder.style.display = 'flex';
        if (detectionInterval) {
            clearInterval(detectionInterval);
            detectionInterval = null;
        }
        // Clear canvas
        ctx.clearRect(0, 0, overlayCanvas.width, overlayCanvas.height);
        updateResults(null);
        startBtn.disabled = false;
        stopBtn.disabled = true;
        setStatus('Stopped', 'offline');
    }

    // --- Load models and init ---
    async function loadModels() {
        setStatus('Loading models…', 'loading');
        startBtn.disabled = true;
        try {
            // Model URL (using latest from vladmandic face-api)
            const MODEL_URL = 'https://cdn.jsdelivr.net/npm/@vladmandic/face-api/model/';
            await faceapi.nets.ssdMobilenetv1.loadFromUri(MODEL_URL);
            await faceapi.nets.faceExpressionNet.loadFromUri(MODEL_URL);
            setStatus('Models ready', 'online');
            startBtn.disabled = false;
        } catch (err) {
            console.error('Model load error:', err);
            setStatus('Failed to load models', 'offline');
            alert('Error loading AI models. Please check your internet connection and reload.');
        }
    }

    // --- Event listeners ---
    startBtn.addEventListener('click', startCamera);
    stopBtn.addEventListener('click', stopCamera);

    // --- Initialise ---
    loadModels();

    // Handle page unload – stop camera
    window.addEventListener('beforeunload', () => {
        if (cameraStream) {
            cameraStream.getTracks().forEach(track => track.stop());
        }
    });
</script>
</body>
</html>
